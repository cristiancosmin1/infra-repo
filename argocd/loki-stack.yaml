apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: loki-stack
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/cristiancosmin1/infra-repo.git
    targetRevision: main
    path: charts/loki-stack

    helm:
      releaseName: loki-stack

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
