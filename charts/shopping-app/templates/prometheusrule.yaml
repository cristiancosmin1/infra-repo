{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: {{ include "shopping-app.fullname" . }}
  namespace: {{ .Release.Namespace }}

  labels:
    {{- include "shopping-app.labels" . | nindent 4 }}
    release: kube-prometheus-stack

spec:
  groups:
    - name: shopping-app.slo
      rules:

        # Real SLO alert:
        # HTTP 5xx error rate must remain below 1%.
        - alert: ShoppingAppHighErrorRate
          expr: |
            (
              sum(rate(shopping_http_requests_total{status=~"5.."}[5m]))
              /
              sum(rate(shopping_http_requests_total[5m]))
            ) > 0.01
          for: 2m

          labels:
            severity: warning
            service: shopping-app
            slo: error-rate

          annotations:
            summary: "Shopping App error rate is too high"
            description: >-
              Shopping App HTTP 5xx error rate has exceeded
              the 1% SLO threshold for more than 2 minutes.

        # Real SLO alert:
        # p95 latency must remain below 500 ms.
        - alert: ShoppingAppHighLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(
                  shopping_http_request_duration_seconds_bucket[5m]
                )
              )
            ) > 0.5
          for: 2m

          labels:
            severity: warning
            service: shopping-app
            slo: latency

          annotations:
            summary: "Shopping App p95 latency is too high"
            description: >-
              Shopping App p95 latency has exceeded
              the 500 ms SLO threshold for more than 2 minutes.

        # TEMPORARY TEST ALERT.
        # This rule is intentionally always true so we can verify:
        # PrometheusRule -> Prometheus -> Alertmanager.
        # Remove this rule after the alerting test is completed.
        - alert: ShoppingAppObservabilityTest
          expr: vector(1)
          for: 1m

          labels:
            severity: warning
            service: shopping-app
            test: "true"

          annotations:
            summary: "Shopping App observability test alert"
            description: >-
              Controlled alert used to validate the
              Prometheus to Alertmanager alerting pipeline.
{{- end }}
